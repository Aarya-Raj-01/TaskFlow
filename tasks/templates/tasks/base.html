<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Productivity Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #26345f;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .btn-primary {
            background: #5268c9;
            border: none;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">TaskFlow</a>

        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="text-white me-3">
                    Hello, {{ user.username }}
                </span>

                <form method="POST" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-light btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-light btn-sm">Login</a>
                <a href="{% url 'register' %}" class="btn btn-warning btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container main-container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
